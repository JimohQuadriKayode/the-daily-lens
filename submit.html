<form
  action="https://formspree.io/f/xdenrlro"
  method="POST"
>
  <input
  type="hidden"
  name="_next"
  value="https://jimohquadrikayode.github.io/submission-success.html"
>

  <label for="name">
    Your Name
  </label>

  <input
    type="text"
    id="name"
    name="name"
    placeholder="Enter your name"
    required
  >


  <label for="email">
    Your Email
  </label>

  <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email address"
    required
  >


  <label for="category">
    Article Category
  </label>

  <select
    id="category"
    name="category"
    required
  >

    <option value="">
      Select a category
    </option>

    <option value="News">
      News
    </option>

    <option value="Sports">
      Sports
    </option>

    <option value="Religion">
      Religion
    </option>

    <option value="Education">
      Education
    </option>

    <option value="Technology">
      Technology
    </option>

    <option value="Business">
      Business
    </option>

    <option value="Lifestyle">
      Lifestyle
    </option>

    <option value="Opinion">
      Opinion
    </option>

  </select>


  <label for="title">
    Article Title
  </label>

  <input
    type="text"
    id="title"
    name="title"
    placeholder="Enter your article title"
    required
  >


  <label for="article">
    Your Article
  </label>

  <textarea
    id="article"
    name="article"
    placeholder="Write or paste your article here..."
    required
  ></textarea>


  <button
    type="submit"
    class="submit-button"
  >
    Submit for Review →
  </button>

</form>
